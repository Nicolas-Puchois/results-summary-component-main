<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Results summary component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <main>
      <div id="main-content">
        <div class="content" id="left">
          <h2>Your Result</h2>
          <span>76 of 100</span>
          <span> Great </span>
          <span>
            <p>
              You scored higher than 65% of the people who have taken these
              tests.
            </p>
          </span>
        </div>
        <section class="content" id="right">
          <h2>Summary</h2>
          <ul>
            <li>
              Reaction 80 / 100
              <img
                src="./assets/images/icon-reaction.svg"
                alt="icon reaction"
              />
            </li>
            <li>
              Memory 92 / 100
              <img src="./assets/images/icon-memory.svg" alt="icon memory" />
            </li>
            <li>
              Verbal 61 / 100
              <img src="./assets/images/icon-verbal.svg" alt="icon verbal" />
            </li>
            <li>
              Visual 72 / 100
              <img src="./assets/images/icon-visual.svg" alt="icon visual" />
            </li>
          </ul>
          <button>Continue</button>
        </section>
        <!-- <div class="attribution">
          Challenge by
          <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
            >Frontend Mentor</a
          >. Coded by <a href="#">Nicolas </a>.
        </div> -->
      </div>
    </main>
  </body>
</html>
